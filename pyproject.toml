[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
failOnWarnings = true
strictListInference = true
strictDictionaryInference = true
reportMissingParameterType = "warning"
reportMissingTypeArgument = "warning"
reportPrivateUsage = "warning"
reportUnknownVariableType = "warning"
reportUnusedVariable = "warning"
include = ["score_coverage", "tools"]
exclude = ["**/__pycache__", "**/.*", "**/bazel-*", "integration_tests"]
venvPath = "."
venv = ".venv_coverage"

[tool.ruff]
line-length = 120
target-version = "py312"  # the only interpreter the module supports (see MODULE.bazel)
extend-exclude = ["__pycache__", ".*", "bazel-*", "integration_tests"]

[tool.ruff.lint]
# Rule set of score_tooling's python_basics/pyproject.toml (S-CORE Python guideline).
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RET", # flake8-return
]

[tool.ruff.lint.isort]
known-first-party = ["score_coverage"]

[tool.ruff.lint.mccabe]
# The S-CORE complexity requirement (gd_req__impl_complexity_analysis) is
# LoC-based: 100 lines per function for safety-related code. McCabe 15 is this
# module's additional ceiling; ruff's default of 10 is the python_basics style
# preference and would force splitting straightforward validation code.
max-complexity = 15

[tool.ty.environment]
python-version = "3.12"
